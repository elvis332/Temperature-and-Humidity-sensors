name: Isolated bridge tests
on:
  push:
    branches: [main, modbus-bridge]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest bridge.test_bridge -v
