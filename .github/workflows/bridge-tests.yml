name: Isolated bridge tests
on:
  push:
    branches: [main, modbus-bridge]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ems-admin.txt
      - run: python -m unittest bridge.test_bridge deploy.test_recovery_supervisor deploy.test_contract deploy.test_site_registry integrations.modbus.test_validate_ems_staging integrations.ems.test_zigbee_control integrations.ems.test_zigbee_api -v
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @(
            'deploy/Install-SanderWatchdogTask.ps1',
            'deploy/Local-PC-ZigbeeWatchdog.ps1',
            'deploy/Install-LocalWatchdog.ps1',
            'deploy/Diagnose-LocalWatchdog.ps1',
            'deploy/Install-SanderServer.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error ($path + ': ' + $_.Message) }
              exit 1
            }
          }
      - run: python -m py_compile bridge/bridge.py integrations/modbus/apply_ui.py integrations/ems/zigbee_control.py integrations/ems/zigbee_api.py deploy/recovery_supervisor.py

  mqtt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: |
          sudo systemctl restart mosquitto
          sudo systemctl --no-pager status mosquitto
          python -m unittest bridge.test_mqtt_integration -v
