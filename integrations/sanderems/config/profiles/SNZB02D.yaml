profile:
  id: SNZB02D
  manufacturer: SONOFF
  model: SNZB-02D
  device_type: environment_sensor
  communication_mode: mqtt
  description: Battery-powered Zigbee temperature/humidity sensor via Zigbee2MQTT.
points:
  - key: temperature_c
    display_name: Temperature
    display_name_zh: 溫度
    unit: °C
    data_type: float
    category: environmental
    enabled: true
    required: true
    writable: false
    status: confirmed
    validation: {min: -40, max: 85}
    source: {simulation: false, mqtt_field: temperature}
  - key: humidity_pct
    display_name: Relative Humidity
    display_name_zh: 相對濕度
    unit: '%RH'
    data_type: float
    category: environmental
    enabled: true
    required: true
    writable: false
    status: confirmed
    validation: {min: 0, max: 100}
    source: {simulation: false, mqtt_field: humidity}
  - key: battery_pct
    display_name: Battery
    display_name_zh: 電池電量
    unit: '%'
    data_type: float
    category: environmental
    enabled: true
    required: false
    writable: false
    status: confirmed
    validation: {min: 0, max: 100}
    source: {simulation: false, mqtt_field: battery}
