[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sander-zigbee-ems-integration"
version = "0.1.0"
description = "Sander Zigbee MQTT-to-Modbus bridge and EMS administrator integration"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.0,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
ems = ["fastapi>=0.115,<1"]
test = ["fastapi>=0.115,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge*", "deploy*", "integrations*"]
namespaces = true
